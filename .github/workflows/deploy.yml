name: Deploy Personal Website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'frontend'
        type: choice
        options: [all, frontend, backend]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ── Type Check & Lint ─────────────────────────────────────────────────────
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

  # ── Build Frontend ────────────────────────────────────────────────────────
  build-frontend:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_OSS_BASE_URL: ${{ secrets.NEXT_PUBLIC_OSS_BASE_URL }}
          NEXTJS_REVALIDATE_TOKEN: ${{ secrets.NEXTJS_REVALIDATE_TOKEN }}
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone
          path: |
            .next/standalone/
            .next/static/
            public/
          retention-days: 1

  # ── Deploy to Aliyun ECS ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Aliyun ECS
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-standalone
          path: .next-build/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        env:
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          FRONTEND_DIR: /var/www/personal-site/frontend
        run: |
          # Upload standalone build
          rsync -avz --delete \
            .next-build/standalone/ \
            "${ECS_USER}@${ECS_HOST}:${FRONTEND_DIR}/"

          rsync -avz --delete \
            .next-build/static/ \
            "${ECS_USER}@${ECS_HOST}:${FRONTEND_DIR}/.next/static/"

          rsync -avz \
            .next-build/public/ \
            "${ECS_USER}@${ECS_HOST}:${FRONTEND_DIR}/public/" || true

          # Create .env from secrets
          ssh "${ECS_USER}@${ECS_HOST}" bash << 'ENVSSH'
            cat > /var/www/personal-site/frontend/.env << ENVEOF
          STRAPI_URL=${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN=${{ secrets.STRAPI_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXTJS_REVALIDATE_TOKEN=${{ secrets.NEXTJS_REVALIDATE_TOKEN }}
          ENVEOF
          ENVSSH

          # Restart PM2
          ssh "${ECS_USER}@${ECS_HOST}" \
            "pm2 restart nextjs --update-env || pm2 start /var/www/personal-site/ecosystem.config.js --only nextjs --env production && pm2 save"

      - name: Health check
        run: |
          sleep 10
          curl -sf "https://${{ secrets.NEXT_PUBLIC_SITE_URL }}" || echo "Health check failed — manual verification needed"

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Deployed at: $(date -u)"
