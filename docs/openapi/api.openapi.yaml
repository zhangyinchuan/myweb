openapi: "3.0.3"
info:
  title: 个人网站 API
  description: |
    个人网站 Strapi v4 REST API 规格文档。
    所有内容接口均为只读（访客无需鉴权），内容管理通过 Strapi Admin 完成。
    Base URL: http://your-domain.com/api
  version: "1.0.0"
  contact:
    name: 个人网站
servers:
  - url: http://localhost:1337/api
    description: 本地开发
  - url: https://your-domain.com/api
    description: 生产环境

tags:
  - name: Blogs
    description: 博客文章
  - name: Videos
    description: 视频推荐
  - name: Books
    description: 书籍推荐
  - name: Categories
    description: 分类
  - name: Tags
    description: 标签
  - name: Global
    description: 全局配置（单例）

# ─── Components ──────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: "pagination[page]"
      in: query
      schema:
        type: integer
        default: 1
    PageSizeParam:
      name: "pagination[pageSize]"
      in: query
      schema:
        type: integer
        default: 12
        maximum: 100
    SortParam:
      name: sort
      in: query
      schema:
        type: string
        default: "publishedAt:desc"
    CategorySlugFilter:
      name: "filters[category][slug][$eq]"
      in: query
      schema:
        type: string
    TagSlugFilter:
      name: "filters[tags][slug][$eq]"
      in: query
      schema:
        type: string
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string

  schemas:
    # ── Primitive Types ──────────────────────────────────────────────────────

    ImageFormat:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          format: uri
          description: CDN 完整 URL
        width:
          type: integer
        height:
          type: integer

    StrapiImage:
      type: object
      required: [id, url, mime, size]
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
          description: OSS CDN 完整 URL
        alternativeText:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        formats:
          type: object
          nullable: true
          properties:
            thumbnail:
              $ref: "#/components/schemas/ImageFormat"
            small:
              $ref: "#/components/schemas/ImageFormat"
            medium:
              $ref: "#/components/schemas/ImageFormat"
            large:
              $ref: "#/components/schemas/ImageFormat"
        mime:
          type: string
        size:
          type: number
          description: 文件大小（KB）

    CategoryType:
      type: string
      enum: [blog, video, book, general]

    ContentStatus:
      type: string
      enum: [draft, published, archived]

    VideoPlatform:
      type: string
      enum: [bilibili, youtube, other]

    BookRating:
      type: integer
      minimum: 1
      maximum: 5

    # ── Rich Text ────────────────────────────────────────────────────────────

    RichTextNode:
      type: object
      description: Strapi Blocks 富文本节点
      properties:
        type:
          type: string
        text:
          type: string
          nullable: true
        bold:
          type: boolean
          nullable: true
        italic:
          type: boolean
          nullable: true
        underline:
          type: boolean
          nullable: true
        strikethrough:
          type: boolean
          nullable: true
        code:
          type: boolean
          nullable: true
        url:
          type: string
          nullable: true
        level:
          type: integer
          nullable: true
        format:
          type: string
          enum: [ordered, unordered]
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/RichTextNode"
          nullable: true

    RichTextContent:
      type: array
      items:
        $ref: "#/components/schemas/RichTextNode"

    # ── Category & Tag ───────────────────────────────────────────────────────

    Category:
      type: object
      required: [id, name, slug, type]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
        description:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/CategoryType"

    Tag:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 100

    # ── Blog ─────────────────────────────────────────────────────────────────

    Blog:
      type: object
      required: [id, title, slug, status, readingTime, viewCount, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
        excerpt:
          type: string
          nullable: true
          description: 摘要，约 100-150 字
        content:
          $ref: "#/components/schemas/RichTextContent"
          nullable: true
        coverAlt:
          type: string
          nullable: true
          maxLength: 255
        readingTime:
          type: integer
          description: 预估阅读时长（分钟）
          default: 0
        viewCount:
          type: integer
          default: 0
        status:
          $ref: "#/components/schemas/ContentStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        cover:
          $ref: "#/components/schemas/StrapiImage"
          nullable: true
        category:
          $ref: "#/components/schemas/Category"
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    BlogListItem:
      description: 博客列表项（不含富文本正文）
      type: object
      required: [id, title, slug, status, readingTime, viewCount, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        coverAlt:
          type: string
          nullable: true
        readingTime:
          type: integer
        viewCount:
          type: integer
        status:
          $ref: "#/components/schemas/ContentStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        cover:
          $ref: "#/components/schemas/StrapiImage"
          nullable: true
        category:
          $ref: "#/components/schemas/Category"
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    # ── Video ────────────────────────────────────────────────────────────────

    Video:
      type: object
      required: [id, title, slug, videoUrl, platform, embedId, status, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
        description:
          type: string
          nullable: true
        videoUrl:
          type: string
          format: uri
          description: B站/YouTube 完整原始 URL
        platform:
          $ref: "#/components/schemas/VideoPlatform"
        embedId:
          type: string
          description: 平台视频 ID，用于生成 iframe src
        duration:
          type: string
          nullable: true
          description: 视频时长，格式 HH:MM:SS
        status:
          $ref: "#/components/schemas/ContentStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        thumbnail:
          $ref: "#/components/schemas/StrapiImage"
          nullable: true
        category:
          $ref: "#/components/schemas/Category"
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    # ── Book ─────────────────────────────────────────────────────────────────

    Book:
      type: object
      required: [id, title, slug, author, status, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
        author:
          type: string
          maxLength: 255
        publisher:
          type: string
          nullable: true
          maxLength: 255
        publishedYear:
          type: integer
          nullable: true
          minimum: 1000
          maximum: 2100
        isbn:
          type: string
          nullable: true
          maxLength: 20
        shortReview:
          type: string
          nullable: true
          description: 简评，列表页展示
        notes:
          $ref: "#/components/schemas/RichTextContent"
          nullable: true
          description: 读书笔记富文本
        rating:
          $ref: "#/components/schemas/BookRating"
          nullable: true
        status:
          $ref: "#/components/schemas/ContentStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        cover:
          $ref: "#/components/schemas/StrapiImage"
          nullable: true
        category:
          $ref: "#/components/schemas/Category"
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    # ── Global ───────────────────────────────────────────────────────────────

    Global:
      type: object
      required: [id, siteName]
      properties:
        id:
          type: integer
        siteName:
          type: string
          maxLength: 100
        tagline:
          type: string
          nullable: true
          maxLength: 255
        githubUrl:
          type: string
          format: uri
          nullable: true
        twitterUrl:
          type: string
          format: uri
          nullable: true
        weiboUrl:
          type: string
          format: uri
          nullable: true
        bilibiliUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        footerText:
          type: string
          nullable: true
          maxLength: 500
        seoTitle:
          type: string
          nullable: true
          maxLength: 100
        seoDescription:
          type: string
          nullable: true
          maxLength: 255
        avatar:
          $ref: "#/components/schemas/StrapiImage"
          nullable: true

    # ── Pagination & Responses ───────────────────────────────────────────────

    PaginationMeta:
      type: object
      required: [page, pageSize, pageCount, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        pageCount:
          type: integer
        total:
          type: integer

    BlogListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BlogListItem"
        meta:
          type: object
          properties:
            pagination:
              $ref: "#/components/schemas/PaginationMeta"

    BlogDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Blog"
        meta:
          type: object

    VideoListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        meta:
          type: object
          properties:
            pagination:
              $ref: "#/components/schemas/PaginationMeta"

    BookListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        meta:
          type: object
          properties:
            pagination:
              $ref: "#/components/schemas/PaginationMeta"

    CategoryListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        meta:
          type: object

    TagListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        meta:
          type: object

    GlobalResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Global"
        meta:
          type: object

    ApiError:
      type: object
      required: [status, error]
      properties:
        status:
          type: integer
        error:
          type: string
        detail:
          type: string
          nullable: true

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:
  /blogs:
    get:
      tags: [Blogs]
      summary: 获取博客列表
      operationId: getBlogs
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
        - $ref: "#/components/parameters/CategorySlugFilter"
        - $ref: "#/components/parameters/TagSlugFilter"
        - name: "filters[status][$eq]"
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
          description: 默认只返回 published
      responses:
        "200":
          description: 博客列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogListResponse"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /blogs/{slug}:
    get:
      tags: [Blogs]
      summary: 通过 slug 获取博客详情
      operationId: getBlogBySlug
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      responses:
        "200":
          description: 博客详情（通过 filters[slug] 查询）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogDetailResponse"
        "404":
          description: 未找到
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /videos:
    get:
      tags: [Videos]
      summary: 获取视频列表
      operationId: getVideos
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
        - $ref: "#/components/parameters/CategorySlugFilter"
        - $ref: "#/components/parameters/TagSlugFilter"
        - name: "filters[platform][$eq]"
          in: query
          schema:
            $ref: "#/components/schemas/VideoPlatform"
      responses:
        "200":
          description: 视频列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoListResponse"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /videos/{slug}:
    get:
      tags: [Videos]
      summary: 通过 slug 获取视频详情
      operationId: getVideoBySlug
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      responses:
        "200":
          description: 视频详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoListResponse"
        "404":
          description: 未找到
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /books:
    get:
      tags: [Books]
      summary: 获取书籍列表
      operationId: getBooks
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
        - $ref: "#/components/parameters/CategorySlugFilter"
        - $ref: "#/components/parameters/TagSlugFilter"
        - name: "filters[rating][$gte]"
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: 最低评分过滤
      responses:
        "200":
          description: 书籍列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /books/{slug}:
    get:
      tags: [Books]
      summary: 通过 slug 获取书籍详情
      operationId: getBookBySlug
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      responses:
        "200":
          description: 书籍详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"
        "404":
          description: 未找到
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /categories:
    get:
      tags: [Categories]
      summary: 获取分类列表
      operationId: getCategories
      parameters:
        - name: "filters[type][$eq]"
          in: query
          schema:
            $ref: "#/components/schemas/CategoryType"
          description: 按内容模块过滤
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

  /tags:
    get:
      tags: [Tags]
      summary: 获取标签列表
      operationId: getTags
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"

  /global:
    get:
      tags: [Global]
      summary: 获取全局站点配置（单例）
      operationId: getGlobal
      responses:
        "200":
          description: 全局配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalResponse"
